let qs = [], i = 0, score = 0, mistakes = [];

function shuffle(arr) {
  for (let j = arr.length - 1; j > 0; j--) {
    const k = Math.floor(Math.random() * (j + 1));
    [arr[j], arr[k]] = [arr[k], arr[j]];
  }
  return arr;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function startQuiz() {
  const count = document.getElementById('count').value;
  qs = shuffle(QUESTIONS.slice());
  if (count !== 'all') qs = qs.slice(0, Number(count));
  i = 0; score = 0; mistakes = [];
  document.getElementById('result').textContent = '';
  render();
  window.scrollTo(0,0);
}
function render() {
  if (i >= qs.length) return finish();
  const x = qs[i];
  let options = '';
  x.opts.forEach((v,j) => {
    const letter = String.fromCharCode(65+j);
    options += '<label class="option"><input type="radio" name="answer" value="'+letter+'"> <b>'+letter+'.</b> '+esc(v)+'</label>';
  });
  document.getElementById('quiz').innerHTML =
    '<div class="card"><div class="small">Pregunta '+(i+1)+' de '+qs.length+' · Captura '+x.id+'</div>'+
    '<h2>'+esc(x.q)+'</h2>'+options+
    '<button type="button" id="nextBtn">Siguiente</button></div>';
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}
function nextQuestion() {
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) { alert('Selecciona una respuesta.'); return; }
  const x = qs[i];
  if (selected.value === x.a) score++;
  else mistakes.push({q:x.q, opts:x.opts, selected:selected.value, correct:x.a, id:x.id});
  i++;
  render();
  window.scrollTo(0,0);
}
function finish() {
  document.getElementById('quiz').innerHTML = '';
  let html = '<div class="card"><div id="result">Resultado: '+score+' / '+qs.length+
             ' ('+Math.round(score/qs.length*100)+'%)</div>';
  if (!mistakes.length) {
    html += '<p>🎉 ¡Perfecto! No tuviste respuestas malas.</p>';
  } else {
    html += '<h2>❌ Preguntas para corregir: '+mistakes.length+'</h2>';
    mistakes.forEach((x,n) => {
      const selIndex = x.selected.charCodeAt(0)-65;
      const corIndex = x.correct.charCodeAt(0)-65;
      html += '<div class="review"><div class="small">Error '+(n+1)+' · Captura '+x.id+'</div>'+
              '<h3>'+esc(x.q)+'</h3>'+
              '<p class="wrong-answer">Tu respuesta: '+esc(x.selected)+'. '+esc(x.opts[selIndex] || '')+'</p>'+
              '<p class="correct">✅ Correcta: '+esc(x.correct)+'. '+esc(x.opts[corIndex] || '')+'</p></div>';
    });
  }
  html += '<button type="button" id="restartBtn" class="secondary">Volver a empezar</button></div>';
  document.getElementById('result').innerHTML = html;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  window.scrollTo(0,0);
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('startBtn').addEventListener('click', startQuiz);
});
</script>
